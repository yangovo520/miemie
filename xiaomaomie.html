<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小猫咩的日常</title>
<style>
:root{--bg:#fff6f1;--card:#fff;--pink:#ffc2cf;--deep:#e9788f;--soft:#ffe3e9;--tx:#6b4550;--mut:#b39199}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:-apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
body{padding:calc(10px + env(safe-area-inset-top)) 12px calc(76px + env(safe-area-inset-bottom));max-width:480px;margin:0 auto;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;outline:none}
input,textarea{font:inherit;color:inherit;outline:none}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top input{flex:1;min-width:0;background:var(--card);border:2px solid var(--soft);border-radius:14px;padding:8px 12px;font-weight:700;font-size:16px}
.chip{background:var(--card);border-radius:14px;padding:8px 12px;font-weight:700;font-size:14px;white-space:nowrap;border:2px solid var(--soft)}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(233,120,143,.12)}
h2{font-size:16px;margin-bottom:10px}
.page{display:none}.page.on{display:block}
.stage{position:relative;height:270px;background:linear-gradient(#ffe9ee,#fff6f1);border-radius:24px;margin-bottom:12px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.stage *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.floor{position:absolute;left:12%;right:12%;bottom:26px;height:14px;border-radius:50%;background:rgba(233,120,143,.14)}
.catbox{position:absolute;left:0;right:0;top:92px;display:flex;justify-content:center;animation:idle 3.4s ease-in-out infinite;pointer-events:none}
@keyframes idle{0%,100%{transform:translateY(8px) rotate(-8deg)}50%{transform:translateY(-30px) rotate(8deg)}}
.cat{display:flex;flex-direction:column;align-items:center;transform-origin:50% 80%}
.decor{font-size:26px;height:32px;letter-spacing:2px;white-space:nowrap}
.face{font-size:clamp(38px,12.5vw,58px);white-space:nowrap;font-weight:700;color:#7a4a56;line-height:1.1}
.zz{position:absolute;right:-6px;top:-8px;font-size:20px;display:none}
.cat.sl .zz{display:block}
.bubble{position:absolute;top:10px;left:50%;transform:translateX(-50%) scale(.6);max-width:88%;min-width:120px;background:#fff;border:2px solid var(--pink);border-radius:18px;padding:8px 12px;text-align:center;font-size:14px;font-weight:600;opacity:0;transition:.22s;pointer-events:none;z-index:3}
.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.bubble:after{content:"";position:absolute;left:50%;bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid var(--pink);border-bottom:2px solid var(--pink);transform:translateX(-50%) rotate(45deg)}
.bubble small{display:block;color:var(--deep);font-size:12px;margin-top:2px}
.hint{position:absolute;bottom:6px;width:100%;text-align:center;font-size:11px;color:var(--mut)}
.a-bounce{animation:bounce .9s}.a-shake{animation:shake .9s}.a-shy{animation:shy 1s}.a-scare{animation:scare .9s}.a-dizzy{animation:dizzy 1.1s}.a-dodge{animation:dodge .9s}.a-wiggle{animation:wiggle .9s}.a-hug{animation:hug 1s}.a-sleep{animation:slp 2.4s}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-55px) scale(1.1,.92)}50%{transform:translateY(0) scale(.92,1.1)}75%{transform:translateY(-25px)}}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-16px) rotate(-12deg)}40%{transform:translateX(16px) rotate(12deg)}60%{transform:translateX(-12px) rotate(-8deg)}80%{transform:translateX(10px) rotate(6deg)}}
@keyframes shy{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(.85) rotate(-10deg)}60%{transform:scale(.88) rotate(10deg)}}
@keyframes scare{0%{transform:scale(1)}20%{transform:scale(.55) translateY(18px)}70%{transform:scale(.6) translateY(14px)}100%{transform:scale(1)}}
@keyframes dizzy{0%{transform:rotate(0)}50%{transform:rotate(360deg) scale(.9)}100%{transform:rotate(720deg)}}
@keyframes dodge{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-70px) rotate(-22deg)}60%{transform:translateX(70px) rotate(22deg)}80%{transform:translateX(-20px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg)}30%{transform:rotate(16deg)}45%{transform:rotate(-14deg)}60%{transform:rotate(14deg)}75%{transform:rotate(-8deg)}}
@keyframes hug{0%,100%{transform:scale(1)}40%,70%{transform:scale(1.3) translateY(10px)}}
@keyframes slp{0%,100%{transform:scale(1)}50%{transform:scale(1.06) translateY(6px)}}
.ht{position:fixed;pointer-events:none;font-size:20px;color:var(--deep);z-index:50;animation:up 1s forwards}
@keyframes up{to{transform:translateY(-70px) scale(1.3);opacity:0}}
.bar{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bar b{width:50px;font-weight:600}
.bar i{flex:1;height:10px;border-radius:6px;background:var(--soft);overflow:hidden;display:block}
.bar i s{display:block;height:100%;border-radius:6px;background:var(--deep);transition:width .4s}
.bar span{width:56px;text-align:right;color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ab{background:var(--soft);border-radius:16px;padding:10px 2px;font-weight:700;font-size:14px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s}
.ab em{font-style:normal;font-size:22px}
.ab:active{transform:scale(.94)}
.ab.hit{background:#ffd9d0}.ab.gold{background:#fff0c4}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--soft)}
.row:last-child{border:0}
.row .e{font-size:26px;width:36px;text-align:center}
.row .n{flex:1;font-size:14px}.row .n small{display:block;color:var(--mut);font-size:12px}
.btn{background:var(--deep);color:#fff;border-radius:14px;padding:9px 14px;font-weight:700;font-size:14px;min-height:40px}
.btn.o{background:var(--soft);color:var(--deep)}
.btn:disabled{opacity:.45}
.feed{display:none;margin-top:10px}.feed.on{display:block}
.moods{display:flex;gap:6px;justify-content:space-between;margin-bottom:10px}
.moods button{flex:1;font-size:24px;padding:8px 0;border-radius:14px;background:var(--soft);border:2px solid transparent}
.moods button.on{border-color:var(--deep);background:#fff}
textarea{width:100%;height:84px;border:2px solid var(--soft);border-radius:14px;padding:10px;resize:none;margin-bottom:10px;font-size:15px}
.hist .row .e{width:34px}
.res{text-align:center;padding:10px 0}
.res .big{font-size:64px;display:inline-block}
.res .big.pop{animation:bounce .9s}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ci{background:var(--soft);border-radius:14px;padding:8px 2px;text-align:center;font-size:11px}
.ci em{font-style:normal;font-size:26px;display:block}
.ci.no{opacity:.5}
.r-N{color:#9a8a8e}.r-R{color:#5d9bd6}.r-SR{color:#b06ad8}.r-SSR{color:#e8a020;font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#fff;box-shadow:0 -3px 14px rgba(233,120,143,.15);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;padding:8px 0;font-size:12px;color:var(--mut);min-height:58px}
.nav button em{display:block;font-style:normal;font-size:22px}
.nav button.on{color:var(--deep);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(107,69,80,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:86%;text-align:center}
.toast.show{opacity:1}
.sig{text-align:center;color:var(--mut);font-size:13px;padding:8px 0 4px}
@media(prefers-reduced-motion:reduce){.catbox{animation-duration:6s}}
</style>
</head>
<body>
<div class="top"><input id="nm" maxlength="8" aria-label="猫咪名字"><div class="chip" id="lvC"></div><div class="chip" id="coinC"></div></div>

<div class="page on" id="p0">
 <div class="stage" id="stage">
  <div class="bubble" id="bub"></div>
  <div class="floor"></div>
  <div class="catbox"><div class="cat" id="cat"><div class="decor" id="decor"></div><div class="face" id="face">(ฅ´ω`ฅ)</div><div class="zz">💤</div></div></div>
  <div class="hint">轻点、按住、滑动，试试摸摸它吧</div>
 </div>
 <div class="card">
  <div class="bar"><b>🍚 饱腹</b><i><s id="b_sat"></s></i><span id="v_sat"></span></div>
  <div class="bar"><b>💗 心情</b><i><s id="b_mood"></s></i><span id="v_mood"></span></div>
  <div class="bar"><b>⚡ 精力</b><i><s id="b_energy"></s></i><span id="v_energy"></span></div>
  <div class="bar"><b>🎀 好感</b><i><s id="b_aff"></s></i><span id="v_aff"></span></div>
 </div>
 <div class="card">
  <div class="grid">
   <button class="ab" data-a="pet"><em>🖐️</em>摸摸</button>
   <button class="ab" id="feedBtn"><em>🍚</em>喂食</button>
   <button class="ab" data-a="sleep"><em>😴</em>睡觉</button>
   <button class="ab" data-a="talk"><em>💬</em>说说话</button>
   <button class="ab" data-a="hug"><em>🤗</em>抱抱</button>
   <button class="ab" data-a="play"><em>🪶</em>逗猫棒</button>
   <button class="ab" data-a="tickle"><em>🤭</em>挠痒痒</button>
   <button class="ab hit" data-a="hit"><em>👊</em>打一下</button>
   <button class="ab gold" id="dailyBtn"><em>🎁</em>每日奖励</button>
  </div>
  <div class="feed" id="feedBar"></div>
 </div>
 <div class="card"><h2>🏠 猫窝装饰</h2><div id="decList"></div></div>
</div>

<div class="page" id="p1">
 <div class="card"><h2>🍽️ 食物</h2><div id="shopFood"></div></div>
 <div class="card"><h2>🎀 装饰</h2><div id="shopDec"></div></div>
</div>

<div class="page" id="p2">
 <div class="card"><h2 id="mTitle"></h2>
  <div class="moods" id="moods"></div>
  <textarea id="mText" maxlength="200" placeholder="今天发生了什么呢？写一点点吧"></textarea>
  <button class="btn" id="mSave" style="width:100%">保存今日心情</button>
 </div>
 <div class="card hist"><h2>📖 心情记录</h2><div id="hist"></div></div>
</div>

<div class="page" id="p3">
 <div class="card"><h2>🎁 神秘盲盒</h2>
  <div class="res" id="res"><div class="big">📦</div><div style="margin-top:6px;color:var(--mut);font-size:14px">每次 40 金币，开出小惊喜</div></div>
  <button class="btn" id="boxBtn" style="width:100%">开启盲盒（40 金币）</button>
 </div>
 <div class="card"><h2 id="cTitle">我的收藏</h2><div class="cg" id="cg"></div>
  <p style="font-size:12px;color:var(--mut);margin-top:10px">重复物品会自动换成金币：N 6 / R 15 / SR 40 / SSR 100</p></div>
</div>

<div class="sig">咩 ovo</div>
<div class="nav"><div id="nav">
 <button class="on" data-t="0"><em>🏠</em>猫窝</button><button data-t="1"><em>🛍️</em>商店</button><button data-t="2"><em>📝</em>今日心情</button><button data-t="3"><em>🎁</em>盲盒</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var KEY="xmd_save_v1",$=function(i){return document.getElementById(i)};
var FOODS=[{id:"f1",n:"猫粮",e:"🍚",p:10,s:20,m:0},{id:"f2",n:"小鱼干",e:"🐟",p:20,s:30,m:3},{id:"f3",n:"牛奶",e:"🥛",p:15,s:20,m:6},{id:"f4",n:"生日蛋糕",e:"🍰",p:40,s:40,m:12}];
var DECOR=[{id:"d1",n:"蝴蝶结",e:"🎀",p:50},{id:"d2",n:"小皇冠",e:"👑",p:120},{id:"d3",n:"花环",e:"🌸",p:60},{id:"d4",n:"墨镜",e:"🕶️",p:90},{id:"d5",n:"围巾",e:"🧣",p:80},{id:"d6",n:"小铃铛",e:"🔔",p:40}];
var BOX=[{id:"b1",n:"小鱼干",e:"🐟",r:"N"},{id:"b2",n:"爱心",e:"💗",r:"N"},{id:"b3",n:"毛线球",e:"🧶",r:"N"},{id:"b4",n:"铃铛",e:"🔔",r:"N"},{id:"b5",n:"蝴蝶结",e:"🎀",r:"R"},{id:"b6",n:"星星",e:"⭐",r:"R"},{id:"b7",n:"猫爪印",e:"🐾",r:"R"},{id:"b8",n:"彩虹",e:"🌈",r:"SR"},{id:"b9",n:"月亮",e:"🌙",r:"SR"},{id:"b10",n:"猫咪皇冠",e:"👑",r:"SSR"}];
var CONV={N:6,R:15,SR:40,SSR:100},BOXCOST=40;
var LV=[[0,"初次见面"],[30,"渐渐熟悉"],[90,"亲近"],[180,"依赖"],[320,"最爱的人"],[500,"灵魂伴侣"]];
var MOODS=[["😊","开心"],["😌","平静"],["😢","难过"],["😠","生气"],["😴","疲惫"]];
var NAMES={sat:"饱腹",mood:"心情",energy:"精力",aff:"好感度",coins:"金币"};
var FACES={base:"(ฅ´ω`ฅ)",happy:"(ฅ^ω^ฅ)",shy:"(ฅ//ω//ฅ)",scare:"(ฅ°д°ฅ)",sad:"(ฅ;ω;ฅ)",dizzy:"(ฅ@ω@ฅ)",sleep:"(ฅ-ω-ฅ)",love:"(ฅ♡ω♡ฅ)",laugh:"(ฅ>ω<ฅ)",wink:"(ฅ´ω`)ﾉ",pout:"(ฅ'ε'ฅ)"};
var ACTS={
pet:{f:["love","happy","shy"],a:["a-wiggle","a-bounce","a-shy"],t:["嘿嘿，好舒服呀！","再摸摸嘛～","呼噜呼噜……","被你摸得好开心喵！"],d:{mood:3,aff:2}},
sleep:{f:["sleep"],a:["a-sleep"],t:["呼……我睡一会儿喵…","Zzz……梦里有小鱼干","晚安，我要补充精力啦"],d:{energy:40,sat:-5}},
talk:{f:["happy","wink","laugh"],a:["a-bounce","a-wiggle"],t:["喵？你在跟我说话吗？","我听着呢，继续说嘛～","今天也想和你待在一起！","咪咪咪，我懂啦～"],d:{aff:1,mood:2,coins:1}},
hug:{f:["love","shy"],a:["a-hug"],t:["抱抱！暖暖的～","把脸埋进你怀里啦","不要松开嘛……","最喜欢被你抱着了！"],d:{aff:3,mood:4}},
play:{f:["laugh","happy"],a:["a-bounce","a-wiggle"],t:["抓到啦！喵呜！","再来再来！我还能跳！","看我的飞扑！","逗猫棒别跑！"],d:{mood:10,energy:-12,aff:2,coins:3,sat:-3}},
tickle:{f:["laugh","wink"],a:["a-wiggle","a-shake"],t:["哈哈哈，好痒好痒！","别挠啦～停不下来啦","咯咯咯，那里不行！","笑到肚子疼喵～"],d:{mood:6,energy:-4,aff:1,coins:2}},
hit:{f:["scare","sad","dizzy","pout"],a:["a-scare","a-shake","a-dizzy","a-dodge"],t:["呜……我被打到啦。","喵……下手轻一点嘛。","我有点委屈……","你是不是心情不好呀？","晕乎乎的……"],d:{mood:-10,aff:-2}},
tap:{f:["happy","shy","wink","love"],a:["a-bounce","a-shy","a-wiggle"],t:["蹭蹭你！","被你发现我的小脑袋啦！","嘿嘿，戳到我啦～","喵？有事吗？"],d:{aff:1,mood:1}},
hold:{f:["love","sleep"],a:["a-hug","a-sleep"],t:["呼噜呼噜，眯眼睛…","就是这里，好舒服～","别停，再摸一会儿！"],d:{aff:1,mood:2}},
stroke:{f:["laugh","happy","shy"],a:["a-wiggle","a-shake","a-shy"],t:["摇摇晃晃～好开心！","痒痒的，再来一下！","跟着你的手指跑啦～","缩起小脑袋嘿嘿"],d:{aff:1,mood:1}}
};
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function defS(){var f={};FOODS.forEach(function(x){f[x.id]=x.id==="f1"?3:0});return{name:"小猫咩",sat:70,mood:70,energy:80,aff:0,coins:50,foods:f,decor:{},worn:{},box:{},moods:{},daily:"",last:Date.now()}}
var S=defS();
try{var raw=JSON.parse(localStorage.getItem(KEY)||"null");if(raw&&typeof raw==="object"){var d0=defS();Object.keys(d0).forEach(function(k){if(raw[k]!==undefined&&raw[k]!==null)S[k]=raw[k]});FOODS.forEach(function(x){if(typeof S.foods[x.id]!=="number")S.foods[x.id]=0})}}catch(e){}
function save(){try{S.last=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function cl(v,a,b){v=Number(v);if(isNaN(v))v=0;return Math.max(a,Math.min(b,v))}
function norm(){S.sat=cl(S.sat,0,100);S.mood=cl(S.mood,0,100);S.energy=cl(S.energy,0,100);S.aff=Math.max(0,Math.floor(S.aff));S.coins=Math.max(0,Math.floor(S.coins))}
// offline decay
(function(){var m=Math.min(240,Math.max(0,(Date.now()-(S.last||Date.now()))/60000));S.sat-=m*.08;S.mood-=m*.05;S.energy-=m*.02;norm()})();
function lvOf(){var l=0;LV.forEach(function(x,i){if(S.aff>=x[0])l=i});return l}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("show")},1800)}
// render
function bar(k){$("b_"+k).style.width=S[k]+"%";$("v_"+k).textContent=Math.round(S[k])+"/100"}
function render(){
 norm();["sat","mood","energy"].forEach(bar);
 var l=lvOf(),nx=LV[l+1];
 $("b_aff").style.width=(nx?(S.aff-LV[l][0])/(nx[0]-LV[l][0])*100:100)+"%";
 $("v_aff").textContent=S.aff+(nx?"/"+nx[0]:"");
 $("lvC").textContent="Lv"+(l+1)+" "+LV[l][1];
 $("coinC").textContent="🪙 "+S.coins;
 $("decor").textContent=DECOR.filter(function(x){return S.worn[x.id]}).map(function(x){return x.e}).join("");
 if(!faceLock)setFace();
 renderFeed();renderDecor();renderShop();renderBox();
 $("dailyBtn").style.opacity=S.daily===today()?".55":"1";
}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function rowOf(e,n,sub,btn){var r=el("div","row");r.appendChild(el("div","e",e));var m=el("div","n",n);m.appendChild(el("small","",sub));r.appendChild(m);if(btn)r.appendChild(btn);return r}
function mkBtn(t,fn,o,dis){var b=el("button","btn"+(o?" o":""),t);if(dis)b.disabled=true;b.onclick=fn;return b}
function renderFeed(){var b=$("feedBar");b.innerHTML="";var any=false;
 FOODS.forEach(function(f){var c=S.foods[f.id]||0;if(c>0){any=true;b.appendChild(rowOf(f.e,f.n+" ×"+c,"饱腹 +"+f.s+(f.m?"，心情 +"+f.m:""),mkBtn("喂它",function(){feed(f)})))}});
 if(!any)b.appendChild(el("p","", "还没有食物，去商店买一些吧～")).style.cssText="font-size:13px;color:#b39199;text-align:center"}
function renderDecor(){var b=$("decList");b.innerHTML="";var any=false;
 DECOR.forEach(function(x){if(S.decor[x.id]){any=true;var w=S.worn[x.id];b.appendChild(rowOf(x.e,x.n,w?"正在佩戴":"在猫窝里",mkBtn(w?"摘下":"戴上",function(){S.worn[x.id]=!w;save();render()},w)))}});
 if(!any)b.appendChild(el("p","","在商店购买装饰后，会放进猫窝哦")).style.cssText="font-size:13px;color:#b39199;text-align:center"}
function renderShop(){var a=$("shopFood"),b=$("shopDec");a.innerHTML="";b.innerHTML="";
 FOODS.forEach(function(f){a.appendChild(rowOf(f.e,f.n,"饱腹 +"+f.s+(f.m?" 心情 +"+f.m:"")+" · 已有 "+S.foods[f.id],mkBtn("🪙"+f.p,function(){buy("food",f)})))});
 DECOR.forEach(function(x){var o=S.decor[x.id];b.appendChild(rowOf(x.e,x.n,o?"已拥有":"猫窝装饰",mkBtn(o?"已购买":"🪙"+x.p,function(){buy("dec",x)},o,o)))})}
function buy(t,x){if(S.coins<x.p){toast("金币不够啦，还差 "+(x.p-S.coins)+" 🪙");return}
 if(t==="dec"&&S.decor[x.id])return;S.coins-=x.p;
 if(t==="food")S.foods[x.id]=(S.foods[x.id]||0)+1;else{S.decor[x.id]=true;S.worn[x.id]=true}
 save();render();toast("购买成功："+x.n+" "+x.e)}
// cat speech & anim
var cat=$("cat"),face=$("face"),bub=$("bub"),faceLock=false,faceT,bubT;
function setFace(k){face.textContent=FACES[k||(S.mood<20||S.sat<15?"sad":"base")]}
function anim(c){cat.classList.remove("a-bounce","a-shake","a-shy","a-scare","a-dizzy","a-dodge","a-wiggle","a-hug","a-sleep");void cat.offsetWidth;if(c)cat.classList.add(c)}
cat.addEventListener("animationend",function(){cat.classList.remove("a-bounce","a-shake","a-shy","a-scare","a-dizzy","a-dodge","a-wiggle","a-hug","a-sleep")});
function say(txt,sub,fk,an,ms){
 if(fk){setFace(fk);faceLock=true}anim(an);
 bub.innerHTML="";bub.appendChild(document.createTextNode(txt));if(sub)bub.appendChild(el("small","",sub));
 bub.classList.add("show");clearTimeout(bubT);bubT=setTimeout(function(){bub.classList.remove("show")},ms||2300);
 clearTimeout(faceT);faceT=setTimeout(function(){faceLock=false;cat.classList.remove("sl");setFace()},ms?ms:1700)}
// acts
var hitT=0,hitN=0,busy=0;
function act(k,force){
 var A=ACTS[k],d=Object.assign({},A.d),txt=pick(A.t),fk=pick(A.f),an=pick(A.a),ms=0;
 if(k==="play"&&S.energy<12){d={mood:2};txt="太累了……让我先睡一会儿吧";fk="sleep";an="a-sleep"}
 if(k==="sleep"&&S.energy>=95){d={};txt="我一点也不困呀～";fk="wink";an="a-bounce"}
 if(k==="hit"){var n=Date.now();hitN=n-hitT<2500?hitN+1:1;hitT=n;
  if(hitN>=3){an="a-dodge";fk="scare";txt=pick(["别、别打了，我要躲起来啦！","呜哇，我躲开啦！"]);d.mood=-6}
  if(hitN>=5){txt="你再打我就不理你了……呜";fk="sad";an="a-scare";d.aff=-3}}
 if(S.mood<20&&d.aff>0)d.aff=Math.max(1,Math.floor(d.aff/2));
 if(S.sat<15&&d.mood>0)d.mood=Math.max(1,Math.floor(d.mood/2));
 var b0={sat:S.sat,mood:S.mood,energy:S.energy,aff:S.aff,coins:S.coins},l0=lvOf();
 Object.keys(d).forEach(function(x){S[x]+=d[x]});norm();
 if(k==="sleep"&&d.energy){cat.classList.add("sl");ms=3000}
 var lines=[];["aff","mood","energy","sat","coins"].forEach(function(x){var df=Math.round(S[x])-Math.round(b0[x]);if(df)lines.push(NAMES[x]+" "+(df>0?"+":"")+df)});
 var l1=lvOf();
 say(txt,lines.join(" · "),fk,an,ms);
 if(l1>l0){S.coins+=20;setTimeout(function(){say("亲密等级提升啦！「"+LV[l1][1]+"」","奖励 金币 +20",  "love","a-bounce",2800);render()},1500)}
 save();render()}
function feed(f){if((S.foods[f.id]||0)<1)return;if(S.sat>=98){say("我吃不下啦，肚子圆滚滚～","", "shy","a-shy");return}
 S.foods[f.id]--;var b=S.sat;S.sat+=f.s;S.mood+=f.m+2;S.aff+=1;norm();
 say(pick(["好吃好吃！吧唧吧唧～","谢谢你的"+f.n+"喵！","嗷呜，最喜欢吃的啦！"]),"饱腹 +"+Math.round(S.sat-b)+" · 好感度 +1","happy","a-bounce");
 $("feedBar").classList.remove("on");save();render()}
$("feedBtn").onclick=function(){$("feedBar").classList.toggle("on")};
document.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){act(b.getAttribute("data-a"))}});
$("dailyBtn").onclick=function(){if(S.daily===today()){say("今天已经领过啦，明天再来吧～","","wink","a-wiggle");toast("今天已领取过每日奖励");return}
 S.daily=today();S.coins+=30;S.aff+=2;say("每日照顾奖励！谢谢你照顾我～","金币 +30 · 好感度 +2","love","a-bounce");save();render()};
// touch
var stage=$("stage"),P=null;
function heart(e){var h=el("span","ht","♡");h.style.left=(e.clientX-8)+"px";h.style.top=(e.clientY-16)+"px";document.body.appendChild(h);setTimeout(function(){h.remove()},1000)}
stage.addEventListener("contextmenu",function(e){e.preventDefault()});
stage.addEventListener("pointerdown",function(e){var r=cat.getBoundingClientRect(),p=26;
 if(e.clientX<r.left-p||e.clientX>r.right+p||e.clientY<r.top-p||e.clientY>r.bottom+p)return;
 if(P){clearTimeout(P.ht);clearInterval(P.hi)}
 P={lx:e.clientX,ly:e.clientY,mv:0,acc:0,ls:0,hold:false,stroke:false};var q=P;
 q.ht=setTimeout(function(){if(P===q&&q.mv<14){q.hold=true;act("hold");heart(e);q.hi=setInterval(function(){if(P===q){act("hold");heart(e)}},1200)}},550)});
window.addEventListener("pointermove",function(e){if(!P)return;var d=Math.hypot(e.clientX-P.lx,e.clientY-P.ly);P.lx=e.clientX;P.ly=e.clientY;P.mv+=d;P.acc+=d;
 if(P.mv>=14&&!P.hold)clearTimeout(P.ht);
 if(P.acc>60&&Date.now()-P.ls>700){P.acc=0;P.ls=Date.now();P.stroke=true;act("stroke");heart(e)}});
function end(e){if(!P)return;clearTimeout(P.ht);clearInterval(P.hi);
 if(!P.hold&&!P.stroke&&P.mv<14&&e.type==="pointerup"){act("tap");heart(e)}P=null}
window.addEventListener("pointerup",end);window.addEventListener("pointercancel",end);
// name
$("nm").value=S.name||"小猫咩";
$("nm").onchange=function(){S.name=this.value.trim()||"小猫咩";this.value=S.name;save();toast("名字改成「"+S.name+"」啦")};
// nav
$("nav").onclick=function(e){var b=e.target.closest("button");if(!b)return;var t=+b.getAttribute("data-t");
 document.querySelectorAll(".page").forEach(function(p,i){p.classList.toggle("on",i===t)});
 document.querySelectorAll("#nav button").forEach(function(x){x.classList.toggle("on",x===b)});
 if(t===2)renderMood();window.scrollTo(0,0)};
// mood diary
var curM="";
function renderMood(){var k=today(),r=S.moods[k];$("mTitle").textContent="今日心情 · "+k;
 if(r&&!renderMood.init){curM=r.m;$("mText").value=r.t||""}renderMood.init=true;
 var box=$("moods");box.innerHTML="";MOODS.forEach(function(m){var b=el("button",curM===m[0]?"on":"",m[0]);b.title=m[1];b.onclick=function(){curM=m[0];renderMood()};box.appendChild(b)});
 $("mSave").textContent=r?"更新今日心情":"保存今日心情";
 var h=$("hist");h.innerHTML="";var ks=Object.keys(S.moods).sort().reverse();
 if(!ks.length)h.appendChild(el("p","","还没有记录，写下今天的心情吧")).style.cssText="font-size:13px;color:#b39199;text-align:center";
 ks.slice(0,60).forEach(function(d){var x=S.moods[d];h.appendChild(rowOf(x.m,d,x.t||"（没有写文字）"))})}
$("mSave").onclick=function(){if(!curM){toast("先选一个心情表情吧");return}
 var k=today(),first=!S.moods[k];S.moods[k]={m:curM,t:$("mText").value.trim()};
 if(first){S.coins+=5;S.aff+=1;toast("已记录，金币 +5 · 好感度 +1")}else toast("今天的心情已更新");
 save();render();renderMood()};
// blind box
function renderBox(){var g=$("cg");g.innerHTML="";var got=0;
 BOX.forEach(function(x){var c=S.box[x.id]||0;if(c)got++;var d=el("div","ci"+(c?"":" no"));d.appendChild(el("em","",c?x.e:"❔"));d.appendChild(el("span","r-"+x.r,c?x.n:"???"));d.appendChild(el("div","",c?x.r+" ×"+c:x.r));g.appendChild(d)});
 $("cTitle").textContent="我的收藏 "+got+"/"+BOX.length;$("boxBtn").disabled=false}
$("boxBtn").onclick=function(){if(S.coins<BOXCOST){toast("金币不够啦，盲盒需要 "+BOXCOST+" 🪙");return}
 S.coins-=BOXCOST;var r=Math.random()*100,rar=r<60?"N":r<88?"R":r<98?"SR":"SSR";
 var pool=BOX.filter(function(x){return x.r===rar}),it=pick(pool),dup=(S.box[it.id]||0)>0;
 S.box[it.id]=(S.box[it.id]||0)+1;var msg;
 if(dup){S.coins+=CONV[rar];msg="重复啦，自动换成 "+CONV[rar]+" 金币"}else msg="新收藏！已放进收藏册";
 save();render();
 var res=$("res");res.innerHTML="";var big=el("div","big pop",it.e);res.appendChild(big);
 var nm=el("div","r-"+rar,it.n+"（"+rar+"）");nm.style.cssText="margin-top:6px;font-weight:700";res.appendChild(nm);
 var sm=el("div","",msg);sm.style.cssText="font-size:13px;color:#b39199;margin-top:2px";res.appendChild(sm);
 toast(dup?"开出 "+it.n+"，换成 "+CONV[rar]+" 金币":"开出新物品："+it.n+" "+it.e)};
// time decay
setInterval(function(){S.sat-=.4;S.mood-=S.sat<20?.6:.25;S.energy-=.1;if(S.energy<15)S.mood-=.2;norm();save();render()},20000);
document.addEventListener("visibilitychange",function(){if(document.hidden)save()});
window.addEventListener("pagehide",save);
render();renderMood();save();
setTimeout(function(){say("欢迎回来～我是"+S.name+"！","","happy","a-bounce",2600)},300);
})();
</script>
